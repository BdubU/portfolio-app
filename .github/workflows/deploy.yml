name: Continuous Integration & Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-package:
    name: 🚀 Build, Lint, and Package Container
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v3

      - name: 🛠️ Set up Docker Buildx compilation engines
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Authenticate securely to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 📦 Compile and push production-hardened container
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/portfolio-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-cluster:
    name: 🌐 Zero-Downtime Rolling Production Cluster Deploy
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v3

      # FIX: Temporary mesh authorization to bypass physical firewalls securely
      - name: 🚀 Connect securely to Tailscale Mesh Network
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_API_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_API_CLIENT_SECRET }}
          tags: tag:server

      - name: 🔐 Configure encrypted SSH key access handshake
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST_IP }} # USE YOUR TAILSCALE SERVER IP HERE!
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🔐 Cryptographic connection established on deployment target nodes!"
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/portfolio-app:latest
            
            docker rm -f live-portfolio-app 2>/dev/null || true
            docker run -d \
              --name live-portfolio-app \
              -p 8087:80 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_HUB_USERNAME }}/portfolio-app:latest
              
            echo "🚀 Continuous Deployment complete! Live portfolio application hot-swapped successfully."
